# weekly 的 Nginx 站点配置
# 放置位置：/etc/nginx/conf.d/weekly.conf
# 修改后必须先执行 nginx -t 校验语法，再 systemctl reload nginx。

server {
    listen 80;
    server_name weekly.gouxinjie.com;

    # 前端静态产物由 Nginx 直接托管
    root /var/www/weekly/web/dist;
    index index.html;

    # SPA 路由回退：4 条路由都是前端路由，刷新 /memo 这类深层路径不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到仅监听内网的 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;

        # X-Real-IP 必须透传，否则后端限流拿到的是 127.0.0.1，所有用户共用一个额度
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/weekly.access.log;
    error_log  /var/log/nginx/weekly.error.log;

    # 前后端同源，因此这里不配置任何 CORS 头
}
