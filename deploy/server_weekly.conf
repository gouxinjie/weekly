# weekly 的 Nginx 站点配置
#
# 放置位置：
#   - CentOS / Alibaba Cloud Linux（yum 安装）：/etc/nginx/conf.d/server_weekly.conf
#   - Debian / Ubuntu（apt 安装）：/etc/nginx/sites-available/server_weekly.conf，
#     再软链到 /etc/nginx/sites-enabled/server_weekly.conf
#
# 生效步骤：先 nginx -t 校验语法，再 systemctl reload nginx。
# 若机器上还留着默认站点（conf.d/default.conf 或 sites-enabled/default），
# 建议删除，避免直接访问 IP 时命中默认站点。

server {
    listen 80;
    server_name weekly.gouxinjie.com;

    # 前端静态产物由 Nginx 直接托管（CI 发布时覆盖此目录）
    root /var/www/weekly/web/dist;
    index index.html;

    # SPA 路由回退：4 条路由都是前端路由，刷新 /todo 这类深层路径不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到仅监听内网的 Node 服务
    # ⚠️ 这里的端口必须与 /var/www/weekly/.env 里的 PORT 完全一致，
    #    不一致时的表现是 502 Bad Gateway（后端在 3701 监听、Nginx 却转发到别处）
    location /api/ {
        proxy_pass http://127.0.0.1:3701;
        proxy_set_header Host $host;

        # X-Real-IP 必须透传，否则后端限流拿到的是 127.0.0.1，所有用户共用一个额度
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/weekly.access.log;
    error_log  /var/log/nginx/weekly.error.log;

    # 前后端同源，因此这里不配置任何 CORS 头
}
